# Ghostty modifyOtherKeys preserves Shift alongside Meta/Control.
# Keep legacy bindings; these aliases run the same commands on macOS.
# Load after winsettings core/shared/profile bindings.
bind-key -T root "M-S-Q"                       kill-pane
bind-key -T root "M-S-H"                       resize-pane -L 3
bind-key -T root "M-S-J"                       resize-pane -D 3
bind-key -T root "M-S-K"                       resize-pane -U 3
bind-key -T root "M-S-L"                       resize-pane -R 3
bind-key -T root "M-S-O"                       break-pane
bind-key -T root "M-S-S"                       run-shell "bash ~/.config/tmux/winsettings/scripts/new_session.sh"
bind-key -T root "M-S-V"                       run-shell -b "bash \$HOME/.config/tmux/winsettings/scripts/paste_from_clipboard.sh"
bind-key -T root "M-S-!"                       join-pane -t :1
bind-key -T root "M-S-@"                       join-pane -t :2
bind-key -T root "M-S-#"                     join-pane -t :3
bind-key -T root "M-S-$"                     join-pane -t :4
bind-key -T root "M-S-%"                     join-pane -t :5
bind-key -T root "M-S-^"                       join-pane -t :6
bind-key -T root "M-S-&"                       join-pane -t :7
bind-key -T root "M-S-*"                       join-pane -t :8
bind-key -T root "M-S-("                       join-pane -t :9
bind-key -T root "C-S-V"                     run-shell -b "bash \$HOME/.config/tmux/winsettings/scripts/paste_from_clipboard.sh"
bind-key -T copy-mode "M-S-V"               send-keys -X cancel \; run-shell -b "bash \$HOME/.config/tmux/winsettings/scripts/paste_from_clipboard.sh"
bind-key -T copy-mode "C-S-V"             send-keys -X cancel \; run-shell -b "bash \$HOME/.config/tmux/winsettings/scripts/paste_from_clipboard.sh"
bind-key -T copy-mode-vi "M-S-V"               send-keys -X cancel \; run-shell -b "bash \$HOME/.config/tmux/winsettings/scripts/paste_from_clipboard.sh"
bind-key -T copy-mode-vi "C-S-V"             send-keys -X cancel \; run-shell -b "bash \$HOME/.config/tmux/winsettings/scripts/paste_from_clipboard.sh"

# tmux does not expand session_name inside this target argument.
bind-key -T root M-o new-window -c "#{pane_current_path}"
