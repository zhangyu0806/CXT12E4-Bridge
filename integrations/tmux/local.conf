# 本机 tmux 本地配置（不入库）。
# 共享集成已由受管入口加载，本机层不要重复 source，以免追加型 hook 累积。

# 以下按需追加本机独有设置（私有远端、路径、命令、密钥等只能放这里）。

# 自动保存/恢复。本机已装 tmux-resurrect + tmux-continuum（install.sh --apply --plugins）。
# 只设 @ 选项与 bind，不占用 session-management 的 client-attached 互斥组。
# 必须排在 tpm.conf 之前：continuum 在插件加载时读取这些选项。
source-file ~/.config/tmux/winsettings/integrations/optional/aggressive-resurrect.conf

# 路径对齐（必须在 aggressive-resurrect.conf 之后）：
# 本版插件默认写 XDG 路径 ~/.local/share/tmux/resurrect，但仓库的两个 hook 脚本
# （resurrect_normalize_commands.sh / post_restore_cleanup.sh）硬编码 $HOME/.tmux/resurrect，
# 且在文件不存在时静默 exit 0 —— 不对齐会导致命令规范化与恢复后 Agent 重启静默失效。
set -g @resurrect-dir '~/.tmux/resurrect'

# 净化后的 tmux session/window/pane 拓扑双向同步。必须位于
# aggressive-resurrect 之后、TPM 加载之前，使保存/恢复 hook 在插件启动时生效。
set-environment -g PYTHONDONTWRITEBYTECODE 1
source-file ~/.config/tmux/winsettings/integrations/optional/session-sync.conf

# 同步恢复出的 Agent pane 以裸命令启动；共享 handler 只识别 exec 形式。
# 本机覆盖同时收敛重复 hook，Agent 退出后恢复为 shell 而不是 dead pane。
set-hook -g pane-died 'run-shell -b "bash ~/.config/tmux/pane-died-handler.sh #{pane_id}"'

# 运行已安装的 TPM 工作树，实际加载 resurrect/continuum。缺插件时 if-shell 静默跳过。
source-file ~/.config/tmux/winsettings/integrations/optional/tpm.conf

# ── F1/F2 切换时输入框冒出 rgb 十六进制乱码 ───────────────────────────────────
# 现象：`000/0000000/0000a9a/0606...` 之类的碎片被当成"用户输入"插进 opencode
# 输入框。它们是 Windows Terminal 内置配色 Tango Dark 的 16 个 OSC 4 应答，被剥掉
# `ESC ]4;N;rgb:RRRR/` 前缀后剩下的绿/蓝分量（已逐字号核对，14/16 逐字命中）。
#
# 根因在 tmux，不在 opencode：
#   1. opencode 的 TUI 用 `OSC 4;N;?` 探测终端调色板；tmux 不认识这个查询，就转发
#      给外层终端，Windows Terminal 回 `ESC ]4;N;rgb:RRRR/GGGG/BBBB BEL`。
#   2. 回包在 WSL2 管道上常被切成多段到达。tmux 的输入解析器开始吃这条 OSC 序列，
#      在 read 边界丢掉解析状态，然后把**剩下的半截当普通字节**转发进 pane。
#      实测（自建 server + 受控 PTY）：整条写入时 pane 收到完好的
#      `\033]4;0;rgb:2929/3434/4f4f\a`；拆成 4 段写入时 pane 只收到 `29/3434/4f4f`
#      —— 前缀被 tmux 吞了。escape-time 0/50 都一样，改不了。
#   3. pane 里的 opencode 收到的已经是纯文本，只能当键盘输入插进输入框。
# F1/F2 切 session 触发 focus-in + refresh-client 全量重绘，正是最容易把回包切碎的
# 时刻，所以每次切换都复现。
#
# 修法：把 16 色调色板告诉 tmux。有了 pane-colours，tmux 就**自己应答** OSC 4，
# 不再转发给外层终端 —— 外层不回包，就没有可被切碎的东西。实测转发数 16 -> 0，
# 且 tmux 的应答是单次完整写入，不可能被切开。
# 值必须与 Windows Terminal 实际配色一致（Tango Dark），否则 opencode 取到的颜色
# 会和终端真实显示不符。改了 WT 配色方案的话，这里要同步改。
setw -g pane-colours[0]  '#000000'
setw -g pane-colours[1]  '#cc0000'
setw -g pane-colours[2]  '#4e9a06'
setw -g pane-colours[3]  '#c4a000'
setw -g pane-colours[4]  '#3465a4'
setw -g pane-colours[5]  '#75507b'
setw -g pane-colours[6]  '#06989a'
setw -g pane-colours[7]  '#d3d7cf'
setw -g pane-colours[8]  '#555753'
setw -g pane-colours[9]  '#ef2929'
setw -g pane-colours[10] '#8ae234'
setw -g pane-colours[11] '#fce94f'
setw -g pane-colours[12] '#729fcf'
setw -g pane-colours[13] '#ad7fa8'
setw -g pane-colours[14] '#34e2e2'
setw -g pane-colours[15] '#eeeeec'

# OSC 10/11（前景/背景）tmux 本来就不转发：不设 window-style 时它直接丢弃，pane 侧
# 拿不到应答只能等超时。设上之后 tmux 用这里的值即时应答，opencode 少等一次超时。
# 值同样取自 Tango Dark（foreground #d3d7cf / background #000000），与终端一致，
# 视觉上不产生变化。
set -g window-style 'fg=#d3d7cf,bg=#000000'
set -g window-active-style 'fg=#d3d7cf,bg=#000000'

# Restore the base left/right split keys after optional session-management
# overrides prefix+l. Session movement remains on prefix+( and prefix+).
bind h split-window -hb -c '#{pane_current_path}'
bind l split-window -h -c '#{pane_current_path}'

# CXT12E4 L2 pane-axis toggles. These stay inside the current tmux window:
# move right/down when possible, then return left/up at the corresponding edge.
bind C-h if-shell -F '#{pane_at_right}' 'select-pane -L' 'select-pane -R'
bind C-j if-shell -F '#{pane_at_bottom}' 'select-pane -U' 'select-pane -D'

# Keep new windows in the active pane's directory. This also corrects the
# managed Alt+o binding whose -t target is not format-expanded by tmux 3.6.
bind c new-window -c '#{pane_current_path}'
bind -n M-o new-window -c '#{pane_current_path}'

# CXT12E4 L2 agent draft control. Ctrl+S is also the tmux prefix, so key9 must
# use prefix+C-s and let this binding forward the stash chord safely.
bind C-s run-shell -b '~/.local/bin/cxt-l2-agent-action stash "#{pane_id}" "#{pane_current_command}"'
# Remove the first evaluation layout's unused palette/status routes.
unbind C-p
unbind C-t

# Reliable encoder-press bindings. Modifier+digit is intercepted by some
# terminal key maps, so K1/K2 use explicit control keys instead.
bind C-e select-layout even-horizontal
bind C-r select-layout even-vertical
bind C-p previous-window
bind C-n next-window
bind C-b last-window

# Legacy prefix+Y prompt cutter retained for manual use; it is no longer
# assigned to L2 key9. Uppercase Y remains separate from prefix+y.
# Install the helper in "$HOME/.local/bin" and include that directory in the
# pane's PATH. Use its command name: some editors split EDITOR on spaces and
# cannot execute a full home path containing spaces, even when quoted.
set-environment -g EDITOR cxt-prompt-cut-editor
set-environment -g VISUAL cxt-prompt-cut-editor
bind Y run-shell -b '~/.local/bin/cxt-prompt-cut-trigger "#{pane_id}" "#{pane_current_command}"'
